<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="hero-section text-center">
            <div class="container">
                <h1>Epicentro Gourmet</h1>
                <p class="mb-4">Gestion de festivales gastronomicos, unidades de venta y personal</p>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/registro/responsable}" class="btn btn-success mr-2">Registrar mi unidad de venta</a>
                    <a th:href="@{/login}" class="btn btn-primary">Iniciar sesion</a>
                </div>
            </div>
        </div>

        <div class="card" th:if="${festivales != null and !festivales.isEmpty()}">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Festivales</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Temporada</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Duracion (dias)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="festival : ${festivales}">
                                <td th:text="${festival.nombre}"></td>
                                <td th:text="${festival.temporada}"></td>
                                <td th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}"></td>
                                <td th:text="${festival.duracionDias}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div th:if="${festivales == null or festivales.isEmpty()}" class="text-center text-muted py-4">
            No hay festivales cargados.
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
