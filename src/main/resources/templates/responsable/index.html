<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header">
            <h2>Panel del Responsable</h2>
            <p class="text-muted">Sesion iniciada como <strong th:text="${username}"></strong></p>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card access-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Empleados</h5>
                        <p class="card-text text-muted">Altas, bajas, modificaciones y filtros de empleados.</p>
                        <span class="badge badge-secondary">Proximamente</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card access-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Platos</h5>
                        <p class="card-text text-muted">Alta de platos de la unidad.</p>
                        <span class="badge badge-secondary">Proximamente</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card access-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Reportes</h5>
                        <p class="card-text text-muted">Canon, haberes, recaudacion, rentabilidad y plato estrella.</p>
                        <span class="badge badge-secondary">Proximamente</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
